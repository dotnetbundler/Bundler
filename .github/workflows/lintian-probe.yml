# 临时探针：trixie 容器内直跑 appstreamcli/lintian 校验 deb fixture metainfo，
# 迭代 appstream-metadata-validation-failed 豁免/修复——定稿后整文件删除。
name: lintian-probe

on:
  push:
    branches: [devin/1791806527-test-matrix-legs]
    paths:
      - '.github/workflows/lintian-probe.yml'
      - 'tests/Bundler.IntegrationTests/Fixtures/Deb/**'

permissions:
  contents: read

jobs:
  probe:
    name: lintian-probe
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: trixie 容器内 pedantic 校验 + 真 deb 真 lintian 对照
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/tests/Bundler.IntegrationTests/Fixtures/Deb/Assets:/m:ro" \
            debian:trixie sh -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq appstream lintian >/dev/null 2>&1
              echo "=== appstreamcli validate --pedantic ==="
              appstreamcli validate --pedantic /m/app.metainfo.xml || true
              echo "=== lintian on minimal deb ==="
              # validate-tree 校验安装树交叉引用：launchable .desktop 与 hicolor icon 必须真在包里
              mkdir -p /tmp/root/DEBIAN /tmp/root/usr/share/metainfo \
                /tmp/root/usr/share/applications /tmp/root/usr/share/icons/hicolor/48x48/apps
              cp /m/app.metainfo.xml /tmp/root/usr/share/metainfo/com.dotnetbundler.debintegrationfixture.metainfo.xml
              cp /m/icon48.png /tmp/root/usr/share/icons/hicolor/48x48/apps/bundler-deb-fixture.png
              printf "[Desktop Entry]\nType=Application\nTerminal=false\nName=Bundler Deb Fixture\nExec=bundler-deb-fixture\nIcon=bundler-deb-fixture\nComment=Bundler deb integration fixture\nCategories=Utility;Development;\nMimeType=text/plain;x-scheme-handler:bundler-fixture;\n" \
                > /tmp/root/usr/share/applications/bundler-deb-fixture.desktop
              printf "Package: test-fixture\nVersion: 1.0-1\nArchitecture: amd64\nMaintainer: T <t@t>\nDescription: t\n" > /tmp/root/DEBIAN/control
              dpkg-deb --build /tmp/root /tmp/test.deb >/dev/null
              lintian /tmp/test.deb | grep -i appstream || echo "lintian: no appstream tags"
            '

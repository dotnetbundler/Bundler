# 发布前全量验证：手动触发，覆盖全功能面。
# 只验不发——nuget 包与 release 资产发布是后期另一步。
# 每条腿统一四段：构建+全量 dotnet test → 产包 → 真装真卸 → 更新链/Special 可跑腿。
name: release-verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04        # linux x64（含 docker 发行版矩阵腿）
          - ubuntu-26.04-arm    # linux arm64 原生腿
          - windows-2025        # win x64
          - windows-11-arm      # win arm64
          - macos-26-intel      # mac Intel-x64
          - macos-26            # mac arm64
    env:
      # 集成真装真卸同意闸——CI runner 是可丢弃环境，装/卸断言即目的
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: 验证（POSIX：linux/macos）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/verify-posix.sh

      - name: 验证（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/verify-windows.ps1

      - name: 上传 Special 证据与失败线索
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.os }}
          path: |
            tests/Special/evidence/
            artifacts/ci/test-progress.log
          if-no-files-found: ignore
          retention-days: 1

  # MAC-APP-OI-09：同一份 macos-universal .app 在 x86_64 与 arm64 宿主各自原生启动。
  # 生产腿产件+全量 sha256 清单随件上传；消费腿在两 mac 宿主校验同一清单再原生启动，
  # "同一包"由清单比对钉死（非各腿重建）。universal 合并只收 FDD——消费腿靠
  # setup-dotnet 的运行时启动（UniversalCodeProbe 拒自包含载荷）。
  universal-produce:
    name: universal-produce
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
      - name: 产 macos-universal .app（FDD 合并）+ sha256 清单
        shell: bash
        run: |
          set -euo pipefail
          FIX=tests/Bundler.IntegrationTests/Fixtures/MacApp
          # fixture 的 BundlerIcon 依赖 BundlerTestIconFile——造同款 512x512 PNG 头喂它
          printf 'iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAAAXNSR0IArs4c6Q==' | \
            base64 -d > "$RUNNER_TEMP/icon.png"
          dotnet publish "$FIX/BundlerMacAppIntegrationFixture.csproj" -c Release \
            -p:BundlerUniversalTargets=osx-x64%3Bosx-arm64 \
            -p:SelfContained=false \
            "-p:BundlerTestIconFile=$RUNNER_TEMP/icon.png" \
            "-p:BundlerIntegrationOutput=$RUNNER_TEMP/universal" --nologo
          APP=$(find "$RUNNER_TEMP/universal" -type d -name '*.app' | head -1)
          test -d "$APP"
          ( cd "$APP" && find . -type f -exec shasum -a 256 {} + | sort ) \
            > "$RUNNER_TEMP/universal/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: universal-app
          path: ${{ runner.temp }}/universal/
          if-no-files-found: error
          retention-days: 1

  universal-consume:
    name: universal-consume-${{ matrix.os }}
    needs: universal-produce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
      - uses: actions/download-artifact@v7
        with:
          name: universal-app
          path: ${{ runner.temp }}/uni
      - name: 同包校验 + lipo 双切片 + 本宿主原生启动
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/uni" -type d -name '*.app' | head -1)
          ( cd "$APP" && shasum -a 256 -c "$RUNNER_TEMP/uni/SHA256SUMS" )
          EXE="$APP/Contents/MacOS/BundlerMacIntegrationFixture"
          lipo -info "$EXE"
          lipo -info "$EXE" | grep -q "x86_64"
          lipo -info "$EXE" | grep -q "arm64"
          chmod +x "$EXE"   # 工件下载不保留执行位
          OUT=$("$EXE" ci-marker)
          echo "$OUT"
          echo "$OUT" | grep -q "BundlerMacIntegrationFixture:ci-marker"

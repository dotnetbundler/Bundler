# 发布前全量验证：手动触发，覆盖全功能面。
# 只验不发——nuget 包与 release 资产发布是后期另一步。
# 每条腿统一四段：构建+全量 dotnet test → 产包 → 真装真卸 → 更新链/Special 可跑腿。
name: release-verify

on:
  workflow_dispatch:
  push:
    branches: [devin/ci-dry-run] # 临时：合入前最后一轮全量验证，合并前摘除

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04        # linux x64（含 docker 发行版矩阵腿）
          - ubuntu-26.04-arm    # linux arm64 原生腿
          - windows-2025        # win x64
          - windows-11-arm      # win arm64
          - macos-26-intel      # mac Intel-x64
          - macos-26            # mac arm64
    env:
      # 集成真装真卸同意闸——CI runner 是可丢弃环境，装/卸断言即目的
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: 验证（POSIX：linux/macos）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/verify-posix.sh

      - name: 验证（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/verify-windows.ps1

      - name: 上传 Special 证据与失败线索
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.os }}
          path: |
            tests/Special/evidence/
            artifacts/ci/test-progress.log
          if-no-files-found: ignore
          retention-days: 1

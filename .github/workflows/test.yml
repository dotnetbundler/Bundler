# 测试矩阵唯一定义：开发期 dispatch 选腿 / 发布期被 verify 以 workflow_call 调全矩阵。
# 消重：测试腿定义只在本文件一份；测试驱动逻辑只在 scripts/ci/run-tests.* 一份。
# 注：job 级 if 在矩阵展开前求值——runner 子集走 select 前置 job 产动态矩阵。
name: test

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 测试套件（all=四工程全跑）
        type: choice
        default: unit
        options: [unit, api, integration, package, all]
      runners:
        description: runner 标签子集，逗号分隔不带空格；all=六腿全跑
        type: string
        default: all
        required: true
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
      runners:
        type: string
        default: all

permissions:
  contents: read

# runners 入组：workflow_call 被 verify 六路调用时 suite 恒 all，靠 runners 分流防互杀。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'all' }}-${{ inputs.runners || 'all' }}
  cancel-in-progress: true

jobs:
  # runners 输入 → 动态矩阵（job-if 拿不到 matrix，前置 job 是规范做法）。
  select:
    name: select
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      # 便宜前置守卫：$VAR 后接非 ASCII（全角标点/箭头）在部分 locale 下会被拼进变量名，
      # set -u 下炸 unbound——本检查强制 ${VAR} 定界写法，失配即拒全矩阵。
      - uses: actions/checkout@v7
      - name: shell 变量邻接检查
        run: |
          python3 - <<'PY'
          import re, glob, sys, os
          pat = re.compile(r'\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7f]')
          def code_prefix(line):
              # bash 词法：# 仅在词首（行首/空白/控制算符后）起注释——$#、${#arr[@]}、
              # 引号内 'a#b' 都不算注释。残余盲区：引号内 "x # y" 之后的真违规会漏检，
              # 接受为已知代价（比"# 一律截断"宽严相济）。
              prev = ''
              for i, c in enumerate(line):
                  if c == '#' and (i == 0 or prev in ' \t;&|()<>'):
                      return line[:i]
                  prev = c
              return line
          try:
              files = glob.glob('**/*', recursive=True, include_hidden=True)
          except TypeError:  # python<3.11 无 include_hidden
              files = glob.glob('**/*', recursive=True)
          hits = []
          shells = ('sh', 'bash', 'zsh', 'dash', 'ash', 'ksh', 'mksh')
          for f in files:
              # shell 脚本全量（扩展名或 shebang 嗅探——postinstall 类无扩展名脚本）+
              # workflow run: 内联 bash（同词法同隐患）；ps1/cmd 词法不同不在此列。
              if not os.path.isfile(f):
                  continue
              nf = f.replace(os.sep, '/')
              if f.endswith(('.sh', '.bash', '.zsh')):
                  pass
              elif nf.startswith('.github/workflows/') and f.endswith(('.yml', '.yaml')):
                  pass
              else:
                  try:
                      she = open(f, encoding='utf-8', errors='replace').readline(256)
                  except OSError:
                      continue
                  toks = she[2:].split() if she.startswith('#!') else []
                  interp = os.path.basename(toks[0]) if toks else ''
                  if interp == 'env':
                      # env 后命令位置不可稳定建模（GNU/BSD 各代选项差异）——任一令牌路径基名
                      # 是 shell 名即纳入；代价仅 "env -u bash" 类退化行多扫一文件，方向保守。
                      interp = next((os.path.basename(t) for t in toks[1:]
                                     if os.path.basename(t) in shells), '')
                  if interp not in shells:
                      continue
              for i, line in enumerate(open(f, encoding='utf-8', errors='replace'), 1):
                  for m in pat.finditer(code_prefix(line)):
                      hits.append(f"{f}:{i}: {line.strip()[:90]}")
          if hits:
              print("::error::$VAR 后接非 ASCII 会在部分 locale 下被拼进变量名（set -u 炸 unbound）——改用 ${VAR} 定界：")
              print('\n'.join(hits))
              sys.exit(1)
          print("shell 变量-非ASCII邻接检查：0 命中")
          PY

      - id: pick
        env:
          RUNNERS_IN: ${{ inputs.runners || 'all' }}
        run: |
          set -euo pipefail
          ALL='["ubuntu-26.04","ubuntu-26.04-arm","windows-2025-vs2026","windows-11-vs2026-arm","macos-26-intel","macos-26"]'
          if [ -z "$RUNNERS_IN" ] || [ "$RUNNERS_IN" = "all" ]; then
            echo "runners=$ALL" >> "$GITHUB_OUTPUT"
          else
            # 逐标签对 ALL 校验并去重——错拼标签会让矩阵腿挂死在不存在 runner 上等不到失败信号。
            python3 - "$ALL" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          allowed = json.loads(sys.argv[1])
          picked = list(dict.fromkeys(x.strip() for x in os.environ["RUNNERS_IN"].split(",") if x.strip()))
          unknown = [x for x in picked if x not in allowed]
          if unknown:
              print(f"::error::未知 runner 标签 {unknown}，合法集合: {allowed}", file=sys.stderr)
              sys.exit(1)
          if not picked:
              print("::error::runners 解析为空", file=sys.stderr)
              sys.exit(1)
          print("runners=" + json.dumps(picked))
          PY
          fi

  legs:
    needs: select
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.runners) }}
    env:
      SUITE: ${{ inputs.suite || 'unit' }}
      # 集成真装真卸同意闸——CI runner 是可丢弃环境，装/卸断言即目的
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # 外部工具 spawn 落盘->诊断工件：挂死现场=文件里最后一条在途 spawn。
      BUNDLER_TOOL_TRACE: ${{ github.workspace }}/artifacts/ci/bundler-tool-trace.log
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      # 常驻 MSBuild 节点持任务程序集锁会致后续 pack MSB3027——build 前先关（win 腿实证）。
      - name: 构建
        shell: bash
        if: runner.os != 'Windows'
        run: dotnet build Bundler.slnx -c Release --nologo
      - name: 构建（Windows）
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          dotnet build-server shutdown | Out-Null
          dotnet build Bundler.slnx -c Release --nologo

      - name: 测试（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/run-tests.sh "$SUITE"
      - name: 测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-tests.ps1 -Suite $env:SUITE

      # 诊断日志走工件不上 job 输出：always() 让绿腿也能下载（负载水位对比等观测面），
      # 挂死经 ToolRunner 有界等待已收敛为步内失败，failure 场景同样覆盖。
      - name: 上传诊断日志（进度/快照/trace）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.os }}
          path: |
            artifacts/ci/test-progress.log
            artifacts/ci/process-snapshots.log
            artifacts/ci/bundler-tool-trace.log
          if-no-files-found: ignore
          retention-days: 1

# 产件工作流（手动）：updater 引导件冻件产线——真架构宿主五腿各产各件上传工件，
# 产物下载后人工入 src/Bundler.Updater.Bootstrap/tools/<rid>/ 冻件随包（本工作流只产不入；
# BootstrapPlan 变更需重产冻件时重跑）。
# 入库清单（本工作流产件）：win x86_64/aarch64/i686、macos x86_64/aarch64/universal fat、
# linux musl 双架构静态件——linux glibc 目标不入库（运行时经 UpdateBootstrapper musl 姊妹件
# 解析）；tools/posix/bundler-updater.sh 是源码件非本流产出，不在此列。
# NativeAOT 不能跨 OS 产件、x64↔arm64 需目标架构工具链——故逐架构真宿主；
# macOS Xcode 默认双工具链，一台产两架构并 lipo 合 fat 件。
name: produce-bootstrap

on:
  workflow_dispatch:

concurrency:
  group: produce-bootstrap
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # linux-x64 腿：只产 musl 静态件——glibc 动态件已无入库消费方
  # （linux-* 目标运行时经 musl 姊妹件解析）。
  # lld 必需：musl 静态 -static-pie 链接走默认 bfd 会断言崩溃（实证过）。
  linux-x64:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # musl 静态件在 alpine SDK 容器内产——容器内 clang 默认 target=musl，crt 目标件为
      # musl 原生件；glibc 宿主直产 musl 需 musl target 的 GCC 探测路径，arm 镜像上缺失（实证两次失败）
      - name: 产 linux-musl-x86_64 引导件（alpine 容器内静态 -static-pie，lld 链接）
        run: |
          mkdir -p /tmp/aot/linux-musl-x86_64
          docker run --rm -v "$PWD:/src" -v /tmp/aot:/aot -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk add --no-cache clang lld zlib-dev zlib-static build-base >/dev/null && \
                   dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r linux-musl-x64 -p:StaticExecutable=true -p:LinkerFlavor=lld -o /aot/linux-musl-x86_64"
      - name: 冒烟——musl 件 glibc 宿主真跑 apply 换包 + alpine 容器再验
        run: |
          set -eux
          # 链接形态留证：musl 件应 static-pie（statically linked）
          file /tmp/aot/linux-musl-x86_64/bundler-updater || true
          # apply 默认 move 语义会消费 payload 目录——每次 apply 前重建
          mkdir -p /tmp/smoke/install /tmp/smoke/payload
          echo v2 > /tmp/smoke/payload/app.txt
          echo v1 > /tmp/smoke/install/app.txt
          /tmp/aot/linux-musl-x86_64/bundler-updater apply --install-dir /tmp/smoke/install --payload /tmp/smoke/payload --log /tmp/smoke/u-musl.log
          grep -q v2 /tmp/smoke/install/app.txt
          # 真 musl 环境只有容器能给——alpine 内再跑一遍静态件
          mkdir -p /tmp/smoke-alpine/install /tmp/smoke-alpine/payload
          echo v1 > /tmp/smoke-alpine/install/app.txt
          echo v2 > /tmp/smoke-alpine/payload/app.txt
          docker run --rm -v /tmp/aot:/aot -v /tmp/smoke-alpine:/smoke alpine:latest \
            /aot/linux-musl-x86_64/bundler-updater apply --install-dir /smoke/install --payload /smoke/payload --log /smoke/u.log
          grep -q v2 /tmp/smoke-alpine/install/app.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-linux-x64
          path: /tmp/aot/*/bundler-updater
          retention-days: 1
          if-no-files-found: error

  # linux-arm 腿：arm64 真宿主只产 musl 静态件，与 linux-x64 腿同构。
  linux-arm:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: 产 linux-musl-aarch64 引导件（alpine 容器内静态 -static-pie，lld 链接）
        run: |
          mkdir -p /tmp/aot/linux-musl-aarch64
          docker run --rm -v "$PWD:/src" -v /tmp/aot:/aot -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk add --no-cache clang lld zlib-dev zlib-static build-base >/dev/null && \
                   dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r linux-musl-arm64 -p:StaticExecutable=true -p:LinkerFlavor=lld -o /aot/linux-musl-aarch64"
      - name: 冒烟——musl 件 glibc 宿主真跑 apply 换包 + alpine 容器再验
        run: |
          set -eux
          # 链接形态留证：musl 件应 static-pie（statically linked）
          file /tmp/aot/linux-musl-aarch64/bundler-updater || true
          # apply 默认 move 语义会消费 payload 目录——每次 apply 前重建
          mkdir -p /tmp/smoke/install /tmp/smoke/payload
          echo v2 > /tmp/smoke/payload/app.txt
          echo v1 > /tmp/smoke/install/app.txt
          /tmp/aot/linux-musl-aarch64/bundler-updater apply --install-dir /tmp/smoke/install --payload /tmp/smoke/payload --log /tmp/smoke/u-musl.log
          grep -q v2 /tmp/smoke/install/app.txt
          # 真 musl 环境只有容器能给——alpine 内再跑一遍静态件
          mkdir -p /tmp/smoke-alpine/install /tmp/smoke-alpine/payload
          echo v1 > /tmp/smoke-alpine/install/app.txt
          echo v2 > /tmp/smoke-alpine/payload/app.txt
          docker run --rm -v /tmp/aot:/aot -v /tmp/smoke-alpine:/smoke alpine:latest \
            /aot/linux-musl-aarch64/bundler-updater apply --install-dir /smoke/install --payload /smoke/payload --log /smoke/u.log
          grep -q v2 /tmp/smoke-alpine/install/app.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-linux-arm
          path: /tmp/aot/*/bundler-updater
          retention-days: 1
          if-no-files-found: error

  # macos 腿：Xcode 双工具链一台产 x86_64+aarch64 两枚，再 lipo 合 universal fat 件。
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: 产 macos-x86_64 引导件
        run: dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r osx-x64 -o /tmp/aot/macos-x86_64
      - name: 产 macos-aarch64 引导件
        run: dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r osx-arm64 -o /tmp/aot/macos-aarch64
      - name: lipo 合 macos-universal fat 件
        run: |
          set -eux
          mkdir -p /tmp/aot/macos-universal
          lipo -create /tmp/aot/macos-x86_64/bundler-updater /tmp/aot/macos-aarch64/bundler-updater \
            -output /tmp/aot/macos-universal/bundler-updater
          # 切片留证
          lipo -info /tmp/aot/macos-universal/bundler-updater
      - name: 冒烟——宿主架构 thin 件与 fat 件各真跑 apply 换包
        run: |
          set -eux
          case "$(uname -m)" in
            arm64)  THIN=/tmp/aot/macos-aarch64/bundler-updater ;;
            x86_64) THIN=/tmp/aot/macos-x86_64/bundler-updater ;;
            *) echo "未知宿主架构" >&2; exit 1 ;;
          esac
          # apply 默认 move 语义会消费 payload 目录——每次 apply 前重建
          mkdir -p /tmp/smoke/install /tmp/smoke/payload
          echo v1 > /tmp/smoke/install/app.txt
          echo v2 > /tmp/smoke/payload/app.txt
          "$THIN" apply --install-dir /tmp/smoke/install --payload /tmp/smoke/payload --log /tmp/smoke/u-thin.log
          grep -q v2 /tmp/smoke/install/app.txt
          # fat 件是真冻件候选——宿主应选中本机切片跑通
          mkdir -p /tmp/smoke/payload
          echo v1 > /tmp/smoke/install/app.txt
          echo v2 > /tmp/smoke/payload/app.txt
          /tmp/aot/macos-universal/bundler-updater apply --install-dir /tmp/smoke/install --payload /tmp/smoke/payload --log /tmp/smoke/u-fat.log
          grep -q v2 /tmp/smoke/install/app.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-macos
          path: /tmp/aot/*/bundler-updater
          retention-days: 1
          if-no-files-found: error

  # windows-x64 腿：一台产 x86_64+i686 两枚——x86 NativeAOT 需 VS x86 工具链，
  # win32 件在 x64 宿主经 WOW64 冒烟。
  windows-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: MSVC x86.x64 工具链探测（NativeAOT 需要链接器）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property installationPath
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      - name: 产 windows-x86_64 引导件
        shell: pwsh
        run: dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r win-x64 -o C:\aot\windows-x86_64
      - name: 产 windows-i686 引导件
        shell: pwsh
        run: dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r win-x86 -o C:\aot\windows-i686
      - name: 冒烟——两件各真跑 apply 换包（i686 件经 WOW64）
        shell: pwsh
        run: |
          # apply 默认 move 语义会消费 payload 目录——每次 apply 前重建
          New-Item -ItemType Directory -Force C:\smoke\install, C:\smoke\payload | Out-Null
          "v2" | Set-Content C:\smoke\payload\app.txt -NoNewline
          "v1" | Set-Content C:\smoke\install\app.txt -NoNewline
          & C:\aot\windows-x86_64\bundler-updater.exe apply --install-dir C:\smoke\install --payload C:\smoke\payload --log C:\smoke\u-x64.log
          if ($LASTEXITCODE -ne 0) { throw "apply rc=$LASTEXITCODE" }
          if ((Get-Content C:\smoke\install\app.txt -Raw) -ne "v2") { throw "swap 未生效" }
          New-Item -ItemType Directory -Force C:\smoke\payload | Out-Null
          "v2" | Set-Content C:\smoke\payload\app.txt -NoNewline
          "v1" | Set-Content C:\smoke\install\app.txt -NoNewline
          & C:\aot\windows-i686\bundler-updater.exe apply --install-dir C:\smoke\install --payload C:\smoke\payload --log C:\smoke\u-x86.log
          if ($LASTEXITCODE -ne 0) { throw "apply rc=$LASTEXITCODE" }
          if ((Get-Content C:\smoke\install\app.txt -Raw) -ne "v2") { throw "swap 未生效" }
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-windows-x64
          path: |
            C:\aot\windows-x86_64\bundler-updater.exe
            C:\aot\windows-i686\bundler-updater.exe
          retention-days: 1
          if-no-files-found: error

  # windows-arm 腿：arm64 真宿主产 windows-aarch64 一枚。
  windows-arm:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: MSVC ARM64 工具链探测（NativeAOT 需要链接器）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property installationPath
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
      - name: 产 windows-aarch64 引导件
        shell: pwsh
        run: dotnet publish src/Bundler.Updater.Bootstrap/Bundler.Updater.Bootstrap.csproj -c Release -r win-arm64 -o C:\aot\windows-aarch64
      - name: 冒烟——宿主真跑 apply 换包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\smoke\install, C:\smoke\payload | Out-Null
          "v1" | Set-Content C:\smoke\install\app.txt -NoNewline
          "v2" | Set-Content C:\smoke\payload\app.txt -NoNewline
          & C:\aot\windows-aarch64\bundler-updater.exe apply --install-dir C:\smoke\install --payload C:\smoke\payload --log C:\smoke\u.log
          if ($LASTEXITCODE -ne 0) { throw "apply rc=$LASTEXITCODE" }
          if ((Get-Content C:\smoke\install\app.txt -Raw) -ne "v2") { throw "swap 未生效" }
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-windows-arm
          path: C:\aot\windows-aarch64\bundler-updater.exe
          retention-days: 1
          if-no-files-found: error

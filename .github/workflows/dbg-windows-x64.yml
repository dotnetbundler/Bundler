# 调试期单宿主工作流——绿后把 push 触发摘掉（改 workflow_dispatch），全绿后统一进 release-verify.yml
name: dbg-windows-x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbg-windows-x64
  cancel-in-progress: true

jobs:
  verify:
    name: windows-2025
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: 验证（POSIX：linux/macos）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/verify-posix.sh

      - name: 验证（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/verify-windows.ps1

      - name: 上传 Special 证据与失败线索
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-windows-2025
          path: |
            tests/Special/evidence/
            artifacts/ci/test-progress.log
          if-no-files-found: ignore
          retention-days: 14

# 开发期定向测试腿：迭代验证载具，不是发布门（发布门仍是 release-verify）。
# dispatch 选 suite×runners 只跑需要的腿；push 触发（tests/scripts/本文件改动）
# 是开发自检通道——跑 unit 套件全矩阵，重量级验证仍 dispatch 或走 release-verify。
name: test-legs

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 测试套件（all=四工程全跑）
        type: choice
        default: unit
        options: [unit, api, integration, localpackages, all]
      runners:
        description: runner 标签子集，逗号分隔不带空格；all=六腿全跑
        type: string
        default: all
        required: true
  push:
    paths:
      - '.github/workflows/test-legs.yml'
      - 'scripts/ci/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legs:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04        # linux x64（含 docker 发行版矩阵腿）
          - ubuntu-26.04-arm    # linux arm64 原生腿
          - windows-2025        # win x64
          - windows-11-arm      # win arm64
          - macos-26-intel      # mac Intel-x64
          - macos-26            # mac arm64
    # runners 输入用逗号包裹做精确词元匹配——避免 macos-26 误中 macos-26-intel。
    if: >-
      github.event_name == 'push' ||
      inputs.runners == 'all' ||
      contains(format(',{0},', inputs.runners), format(',{0},', matrix.os))
    env:
      SUITE: ${{ inputs.suite || 'unit' }}
      # 集成真装真卸同意闸——CI runner 是可丢弃环境，装/卸断言即目的
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      # 常驻 MSBuild 节点持任务程序集锁会致后续 pack MSB3027——build 前先关（win 腿实证）。
      - name: 构建
        shell: bash
        if: runner.os != 'Windows'
        run: dotnet build Bundler.slnx -c Release --nologo
      - name: 构建（Windows）
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          dotnet build-server shutdown | Out-Null
          dotnet build Bundler.slnx -c Release --nologo

      - name: 测试（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/run-suite.sh "$SUITE"
      - name: 测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run-suite.ps1 -Suite $env:SUITE

      - name: 上传失败线索（进度日志）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: progress-${{ matrix.os }}
          path: artifacts/ci/test-progress.log
          if-no-files-found: ignore
          retention-days: 1

# 一次性验收：新增腿的快速迭代 workflow——绿后把常驻腿并入 release-verify 再删本文件。
name: dbg-accept

on:
  push:
    branches: [ devin/ci-dry-run ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-11-arm
          - macos-26
    env:
      BUNDLER_INTEGRATION_ALLOW_LOCAL_INSTALL: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: 验收新腿（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/dbg-accept.sh

      - name: 验收新腿（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/dbg-accept.ps1

      - name: 证据上传
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbg-accept-${{ matrix.os }}
          path: tests/Special/evidence/
          if-no-files-found: ignore
          retention-days: 1
